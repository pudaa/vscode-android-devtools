<!DOCTYPE html>
<html>
<head>
    <meta charset="utf8">
    <style type="text/css">
        /* ── theme-aware level colors ── */
        .V {color:#777} .vscode-light .V {color:#999} .vscode-high-contrast .V {color:#fff}
        .D {color:#8b8} .vscode-light .D {color:#292} .vscode-high-contrast .D {color:#0a0}
        .I {color:#99a} .vscode-light .I {color:#557} .vscode-high-contrast .I {color:#aaf}
        .W {color:#C84} .vscode-light .W {color:#F80} .vscode-high-contrast .W {color:#f80}
        .E {color:#f88} .vscode-light .E {color:#f55} .vscode-high-contrast .E {color:#f00}
        .F {color:#f66} .vscode-light .F {color:#f00} .vscode-high-contrast .F {color:#f00}
        .hide {display:none}
        .logblock {display:block}
        .filter {display:none}

        /* ── layout ── */
        .a {display:flex;flex-direction:column;position:absolute;top:0;bottom:0;left:0;right:0;}
        .b {flex:0 0 auto;border-bottom:1px solid rgba(128,128,128,.2);padding:.4em .6em .5em .6em;}
        .c {flex:1 1 auto;overflow:auto;padding:.3em 0;}
        body {font-family:var(--vscode-font-family);font-size:var(--vscode-font-size);margin:0;}

        /* ── toolbar row ── */
        .toolbar {display:flex;align-items:center;gap:.4em;flex-wrap:wrap;}
        .toolbar input[type=text] {flex:1 1 auto;min-width:8em;padding:.3em .5em;outline:none;border:solid 1px #444;color:var(--vscode-input-foreground);background:var(--vscode-input-background);border-radius:3px;}
        .toolbar input[type=text]:focus {border-color:#4a4;}
        .vscode-light .toolbar input[type=text] {color:#333;border-color:#444;background:none;}
        .vscode-high-contrast .toolbar input[type=text] {color:#fff;border-color:#0cc;background:none;}

        /* ── level filter buttons ── */
        .lvl {padding:.15em .6em;border:1px solid #444;background:none;color:#999;border-radius:4px;cursor:pointer;font-size:.95em;line-height:1.35;transition:background .12s,color .12s,border-color .12s;}
        .lvl:hover:enabled {color:#ccc;}
        .lvl.on {background:#333;color:#fff;}
        .lvl[data-lvl="V"].on {background:#555;color:#fff;}
        .lvl[data-lvl="D"].on {background:#2a5;color:#fff;}
        .lvl[data-lvl="I"].on {background:#256;color:#fff;}
        .lvl[data-lvl="W"].on {background:#a80;color:#fff;}
        .lvl[data-lvl="E"].on {background:#b22;color:#fff;}
        .lvl[data-lvl="F"].on {background:#a00;color:#fff;}
        .vscode-light .lvl {color:#666;border-color:#bbb;}
        .vscode-light .lvl:hover:enabled {color:#333;}
        .vscode-light .lvl.on {color:#fff;}
        .vscode-high-contrast .lvl {color:#fff;border-color:#0cc;}
        .vscode-high-contrast .lvl:hover:enabled {border-color:darkorange;}

        /* ── action buttons (pause/clear/scroll) ── */
        .act {padding:.15em .5em;border:1px solid #444;background:none;color:#aaa;border-radius:4px;cursor:pointer;font-size:.95em;line-height:1.35;transition:background .12s,color .12s,border-color .12s;}
        .act:hover:enabled {color:#fff;}
        .act.on {background:#444;color:#fff;}
        .act:disabled {opacity:.4;cursor:default;}
        /* filter mode + process selects (all logs / package:mine / process) */
        #procselect {padding:.15em .5em;border:1px solid #444;background:none;color:#aaa;border-radius:4px;cursor:pointer;font-size:.95em;line-height:1.35;background:var(--vscode-input-background);color:var(--vscode-input-foreground);}
        #procselect:focus {outline:none;border-color:#4a4;}
        /* column visibility popup */
        .b {position:relative;}
        .colmenu {display:none;position:absolute;top:100%;right:.6em;background:var(--vscode-menu-background);border:1px solid var(--vscode-menu-border,#444);border-radius:4px;padding:.4em .6em;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.3);}
        .colmenu.show {display:block;}
        .colmenu label {display:block;padding:.15em .2em;cursor:pointer;white-space:nowrap;color:var(--vscode-menu-foreground);}
        #rc.hide-t .t, #rc.hide-lvl .lvl, #rc.hide-pid .pid, #rc.hide-tid .tid, #rc.hide-tag .tag, #rc.hide-msg .msg {display:none;}
        .vscode-light .act {color:#555;border-color:#bbb;}
        .vscode-light .act:hover:enabled {color:#000;}
        .vscode-light .act.on {background:#ccc;color:#000;}
        .vscode-high-contrast .act {color:#fff;border-color:#0cc;}
        .vscode-high-contrast .act.on {background:#0cc;color:#000;}

        /* ── column header (sticky, aligned with the rows below) ── */
        .lc {display:flex;align-items:center;position:sticky;top:0;z-index:2;padding:0 .6em;line-height:1.9;font-size:.85em;opacity:.85;background:var(--vscode-sideBar-background);border-bottom:1px solid rgba(128,128,128,.25);user-select:none;}
        .lc .t {flex:0 0 10.5em;padding-right:.8em;font-variant-numeric:tabular-nums;}
        .lc .lvl {flex:0 0 1.4em;text-align:center;}
        .lc .pid {flex:0 0 4.5em;padding-right:.8em;font-variant-numeric:tabular-nums;}
        .lc .tid {flex:0 0 4.5em;padding-right:.8em;font-variant-numeric:tabular-nums;}
        .lc .tag {flex:0 0 auto;max-width:12em;overflow:hidden;text-overflow:ellipsis;padding-right:.8em;}
        .lc .msg {flex:1 1 auto;}

        /* ── log rows ── */
        .log {white-space:nowrap;display:flex;padding:0 .6em;line-height:1.5;font-variant-numeric:tabular-nums;content-visibility:auto;contain-intrinsic-size:1.5em;}
        /* Must win over .log's display:flex (same specificity, defined later),
           otherwise filtered-out rows are counted but still rendered. */
        .log.filter {display:none;}
        .log:hover {background:rgba(128,128,128,.12);}
        .log .t {flex:0 0 10.5em;color:#888;padding-right:.8em;}
        .log .lvl {flex:0 0 1.4em;border:none;padding:0;text-align:center;font-weight:bold;}
        .log .pid {flex:0 0 4.5em;color:#6a9;padding-right:.8em;}
        .log .tid {flex:0 0 4.5em;color:#698;padding-right:.8em;}
        .log .tag {flex:0 0 auto;color:#c9a;padding-right:.8em;max-width:12em;overflow:hidden;text-overflow:ellipsis;}
        .log .msg {flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
        /* expanded long message: click the message area to expand/collapse */
        .log.expanded {align-items:flex-start;content-visibility:visible;}
        .log.expanded .msg {white-space:normal;word-break:break-word;overflow:visible;height:auto;}
        .log.expanded .tag {white-space:nowrap;}
        .vscode-light .log .t {color:#888;}
        .vscode-light .log .pid {color:#378;}
        .vscode-light .log .tid {color:#389;}
        .vscode-light .log .tag {color:#a56;}
        .vscode-high-contrast .log .t {color:#aaa;}
        .vscode-high-contrast .log .pid {color:#6cf;}
        .vscode-high-contrast .log .tid {color:#5ad;}
        .vscode-high-contrast .log .tag {color:#f9c;}

        /* ── empty state ── */
        #rows:empty::before {content:'!{lWaitingLogs}';display:block;padding:.8em .6em;opacity:.5;font-size:.95em;}

        /* ── status / count ── */
        #lcount {font-family:var(--vscode-font-family);font-size:.9em;margin-top:.3em;color:#6a6;font-variant-numeric:tabular-nums;}
        .vscode-light #lcount {color:#373;}
        .vscode-high-contrast #lcount {color:#0d0;}
        #status {color:var(--vscode-foreground);opacity:.7;padding:.2em .6em;}
        .sep {flex:1 1 auto;}
    </style>
</head>
<body>
    <div class="a">
        <div class="b">
            <div class="toolbar">
                <select id="procselect" title="!{lProcessTitle}">
                    <option value="mine">!{lFilterMine}</option>
                    <option value="all">!{lFilterAll}</option>
                </select>
                <input id="q" placeholder="!{lFilterPlaceholder}" title="!{lFilterTitle}"/>
                <button id="pausebtn" class="act" title="!{lPause}">⏸</button>
                <button id="scrollbtn" class="act on" title="!{lAutoScroll}">⇣</button>
                <button id="clearlcbtn" class="act" disabled="true" title="!{lClear}">🗑</button>
                <button id="exportbtn" class="act" disabled="true" title="!{lExport}">⤓</button>
                <button id="colbtn" class="act" title="!{lColumns}">▤</button>
                <div id="colmenu" class="colmenu">
                    <label><input type="checkbox" data-col="t" checked/> !{lColTime}</label>
                    <label><input type="checkbox" data-col="lvl" checked/> !{lColLevel}</label>
                    <label><input type="checkbox" data-col="pid" checked/> !{lColPid}</label>
                    <label><input type="checkbox" data-col="tid" checked/> !{lColTid}</label>
                    <label><input type="checkbox" data-col="tag" checked/> !{lColTag}</label>
                    <label><input type="checkbox" data-col="msg" checked/> !{lColMessage}</label>
                </div>
            </div>
            <div class="toolbar" style="margin-top:.35em;">
                <span style="opacity:.7;font-size:.9em;">!{lLevel}</span>
                <button class="lvl on" data-lvl="V">V</button>
                <button class="lvl on" data-lvl="D">D</button>
                <button class="lvl on" data-lvl="I">I</button>
                <button class="lvl on" data-lvl="W">W</button>
                <button class="lvl on" data-lvl="E">E</button>
                <button class="lvl on" data-lvl="F">F</button>
                <span class="sep"></span>
                <span id="lcount"></span>
            </div>
        </div>
        <div id="rc" class="c">
            <div class="lc">
                <span class="t">!{lColTime}</span>
                <span class="lvl">!{lColLevel}</span>
                <span class="pid">!{lColPid}</span>
                <span class="tid">!{lColTid}</span>
                <span class="tag">!{lColTag}</span>
                <span class="msg">!{lColMessage}</span>
            </div>
            <div id="status">!{status}</div>
            <div id="rows">!{oldlogs}</div>
        </div>
    </div>
    <script>
            (function() {
                const getId = document.getElementById.bind(document);
                const setStatus = (x) => { getId('status').textContent = ''+x; }

                /**
                 * Parse a logcat line into parts.
                 * Supports both common output formats:
                 *   threadtime: "MM-DD HH:MM:SS.mmm PID TID LEVEL TAG: message"
                 *   time:       "MM-DD HH:MM:SS.mmm LEVEL/TagName(PID): message"
                 * Returns {time, lvl, pid, tid, tag, msg}; falls back gracefully.
                 */
                const parseLog = (line) => {
                    // threadtime: time PID TID LEVEL TAG: msg
                    let m = line.match(/^(\d\d-\d\d\s+\d\d:\d\d:\d\d\.\d+)\s+(\d+)\s+(\d+)\s+([VDIWEF])\s+([^:]+):\s?(.*)$/);
                    if (m) {
                        return { time: m[1], pid: m[2], tid: m[3], lvl: m[4], tag: m[5], msg: m[6] };
                    }
                    // time: time LEVEL/Rest
                    m = line.match(/^(\d\d-\d\d\s+\d\d:\d\d:\d\d\.\d+)\s+([VDIWEF])\/(.*)$/);
                    if (m) {
                        const time = m[1], lvl = m[2], rest = m[3];
                        let pid = '', tid = '', tag = '', msg = rest;
                        // TagName(PID): msg   or   TagName(PID TID): msg
                        let m2 = rest.match(/^([^(]+)\(\s*(\d+)(?:\s+(\d+))?\)\s*:\s?(.*)$/);
                        if (m2) {
                            tag = m2[1].trim(); pid = m2[2]; tid = m2[3] || ''; msg = m2[4];
                            return { time, lvl, pid, tid, tag, msg };
                        }
                        // PID TID Tag: msg
                        m2 = rest.match(/^(\d+)\s+(?:\d+\s+)?([^:]+):\s?(.*)$/);
                        if (m2) {
                            pid = m2[1]; tag = m2[2].trim(); msg = m2[3];
                            return { time, lvl, pid, tid, tag, msg };
                        }
                        // Tag: msg
                        m2 = rest.match(/^([^:]+):\s?(.*)$/);
                        if (m2) {
                            tag = m2[1].trim(); msg = m2[2];
                            return { time, lvl, pid, tid, tag, msg };
                        }
                        return { time, lvl, pid, tid, tag, msg: rest };
                    }
                    // fallback: no timestamp
                    const m3 = line.match(/\b([VDIWEF])\//);
                    return { time: '', lvl: (m3 && m3[1]) || '', pid: '', tid: '', tag: '', msg: line };
                };

                const start = () => {
                    var rows = getId('rows'), filter = getId('q');
                    var last_known_scroll_position=0, selectall=0, logcount=0, prevlc=0, currfilter,ws;
                    var paused = false;
                    var autoScroll = true;
                    var levelFilter = { V:true, D:true, I:true, W:true, E:true, F:true };
                    // log direction: true = newest at the top (Android Studio style),
                    // false = newest at the bottom (terminal style, the default)
                    var newestFirst = !{lNewestFirst} === true;
                    var pendingLines = [];
                    // performance: cached visible row count + rAF-batched rendering
                    var visibleCount = 0;
                    var rafScheduled = false;

                    // Cap the number of rendered log rows so the page doesn't get slower
                    // as logs accumulate (DOM nodes were previously never removed).
                    var MAX_LOG_ROWS = 3000;

                    // ── re-order the bootstrap history to match the direction ──
                    // The backend buffers history newest-first; terminal style wants
                    // oldest at the top, newest at the bottom. Move the row nodes
                    // around once, at startup (cheap, happens before any live data).
                    var reorderHistory = function(rows) {
                        if (!newestFirst) {
                            var logs = rows.getElementsByClassName('log');
                            var arr = Array.prototype.slice.call(logs);
                            // currently newest-first -> reverse to oldest-first
                            arr.reverse();
                            arr.forEach(function(el) { rows.appendChild(el); });
                        }
                    };
                    // re-order the bootstrap history so it matches the direction
                    reorderHistory(rows);

                    var trimLogRows = function(rows) {
                        var all = rows.getElementsByClassName('log');
                        while (all.length > MAX_LOG_ROWS) {
                            // newest-first: drop the OLDEST rows at the bottom;
                            // terminal style: drop the OLDEST rows at the top
                            var last = newestFirst ? all[all.length - 1] : all[0];
                            if (last && last.parentNode) {
                                if (!last.classList.contains('filter')) visibleCount--;
                                last.parentNode.removeChild(last);
                            }
                            else break;
                        }
                    };

                    /**
                     * Build a structured log row element from a parsed line.
                     */
                    const buildRow = (parsed, rawText) => {
                        const div = document.createElement('div');
                        div.className = 'log ' + parsed.lvl;
                        div.dataset.lvl = parsed.lvl;
                        const t = document.createElement('span');
                        t.className = 't'; t.textContent = parsed.time;
                        const l = document.createElement('span');
                        l.className = 'lvl ' + parsed.lvl; l.textContent = parsed.lvl;
                        const p = document.createElement('span');
                        p.className = 'pid'; p.textContent = parsed.pid;
                        const ti = document.createElement('span');
                        ti.className = 'tid'; ti.textContent = parsed.tid;
                        const tg = document.createElement('span');
                        tg.className = 'tag'; tg.textContent = parsed.tag;
                        const m = document.createElement('span');
                        m.className = 'msg'; m.textContent = parsed.msg;
                        // hover shows the full message; click the message to expand/collapse
                        m.title = parsed.msg;
                        m.addEventListener('click', (ev) => {
                            ev.stopPropagation();
                            div.classList.toggle('expanded');
                        });
                        div.appendChild(t); div.appendChild(l); div.appendChild(p); div.appendChild(ti); div.appendChild(tg); div.appendChild(m);
                        div._text = rawText || [parsed.time, parsed.lvl, parsed.pid, parsed.tid, parsed.tag, parsed.msg].join(' ');
                        return div;
                    };

                    // level filter: show/hide based on current levelFilter map
                    const applyLevelToRow = (row) => {
                        if (!row) return true;
                        const visible = levelFilter[row.dataset.lvl] !== false;
                        row.classList.toggle('filter', !visible);
                        return visible;
                    };

                    const refreshLevelFilter = () => {
                        const all = rows.getElementsByClassName('log');
                        visibleCount = 0;
                        for (let i = 0; i < all.length; i++) {
                            if (applyAllFilters(all[i])) visibleCount++;
                        }
                        updateLogCountDisplay();
                    };

                    // combined level + regex filter
                    const applyAllFilters = (row) => {
                        if (!row) return true;
                        const levelVisible = applyLevelToRow(row);
                        let regexVisible = true;
                        if (currfilter) regexVisible = currfilter.test(row._text);
                        const visible = levelVisible && regexVisible;
                        row.classList.toggle('filter', !visible);
                        return visible;
                    };

                    // render pending lines (called on data, or when unpaused)
                    const flushPending = () => {
                        if (paused) return;
                        if (!pendingLines.length) return;
                        // batch-insert via a DocumentFragment so the browser lays out
                        // once instead of once per row (big win for high log rates)
                        const frag = document.createDocumentFragment();
                        // pendingLines is chronological (oldest first)
                        if (newestFirst) {
                            // Android Studio style: newest lines go to the top, so
                            // iterate newest->oldest while appending to the fragment
                            for (let i = pendingLines.length - 1; i >= 0; i--) {
                                const line = pendingLines[i];
                                const parsed = parseLog(line);
                                const row = buildRow(parsed, line);
                                if (applyAllFilters(row)) visibleCount++;
                                frag.appendChild(row);
                            }
                            rows.insertBefore(frag, rows.firstChild);
                        } else {
                            // terminal style (default): append to the bottom in order
                            for (let i = 0; i < pendingLines.length; i++) {
                                const line = pendingLines[i];
                                const parsed = parseLog(line);
                                const row = buildRow(parsed, line);
                                if (applyAllFilters(row)) visibleCount++;
                                frag.appendChild(row);
                            }
                            rows.appendChild(frag);
                        }
                        logcount += pendingLines.length;
                        pendingLines.length = 0;
                        trimLogRows(rows);
                        updateLogCountDisplay();
                        // #rc is the scroll container (overflow:auto), not #rows
                        if (autoScroll) {
                            const rc = getId('rc');
                            rc.scrollTop = newestFirst ? 0 : rc.scrollHeight;
                        }
                    };

                    // batch everything that arrives within one animation frame into a
                    // single render pass instead of one DOM update per WebSocket message
                    const scheduleFlush = () => {
                        if (paused || rafScheduled) return;
                        rafScheduled = true;
                        requestAnimationFrame(() => {
                            rafScheduled = false;
                            flushPending();
                        });
                    };

                    const selecttext = (rows) => {
                        if (!rows) return window.getSelection().empty();
                        var range = document.createRange();
                        range.selectNode(rows);
                        window.getSelection().addRange(range);
                    };

                    // ── toolbar buttons ──
                    // process/filter selector: package:mine / all logs / a specific debug process
                    getId('procselect').value = '!{lFilterMode}';
                    getId('procselect').onchange = () => {
                        const v = getId('procselect').value;
                        if (!ws) return;
                        if (v === 'mine' || v === 'all') {
                            ws.send('cmd:set_filter:' + v);
                        } else if (v.indexOf('proc:') === 0) {
                            ws.send('cmd:set_process:' + v.slice(5));
                        }
                    };
                    // column visibility (hide time/level/pid/tid/tag/message as needed)
                    const hiddenCols = JSON.parse(localStorage.getItem('lcHiddenCols') || '[]');
                    const applyHiddenCols = () => {
                        const root = getId('rc');
                        ['t','lvl','pid','tid','tag','msg'].forEach(c => {
                            root.classList.toggle('hide-' + c, hiddenCols.indexOf(c) >= 0);
                        });
                    };
                    document.querySelectorAll('#colmenu input[data-col]').forEach(cb => {
                        const col = cb.dataset.col;
                        cb.checked = hiddenCols.indexOf(col) < 0;
                        cb.onchange = () => {
                            const i = hiddenCols.indexOf(col);
                            if (!cb.checked && i < 0) hiddenCols.push(col);
                            if (cb.checked && i >= 0) hiddenCols.splice(i, 1);
                            localStorage.setItem('lcHiddenCols', JSON.stringify(hiddenCols));
                            applyHiddenCols();
                        };
                    });
                    getId('colbtn').onclick = () => {
                        getId('colmenu').classList.toggle('show');
                    };
                    document.addEventListener('click', (e) => {
                        const m = getId('colmenu');
                        if (m.classList.contains('show') && !m.contains(e.target) && e.target.id !== 'colbtn') {
                            m.classList.remove('show');
                        }
                    });
                    applyHiddenCols();
                    getId('clearlcbtn').onclick = (e) => {
                        ws && ws.send('cmd:clear_logcat');
                    };
                    getId('exportbtn').onclick = (e) => {
                        ws && ws.send('cmd:export_logcat');
                    };
                    getId('pausebtn').onclick = (e) => {
                        paused = !paused;
                        getId('pausebtn').classList.toggle('on', paused);
                        if (!paused) flushPending();
                    };
                    getId('scrollbtn').onclick = (e) => {
                        autoScroll = !autoScroll;
                        getId('scrollbtn').classList.toggle('on', autoScroll);
                        if (autoScroll) getId('rc').scrollTop = newestFirst ? 0 : getId('rc').scrollHeight;
                    };
                    document.querySelectorAll('.lvl[data-lvl]').forEach(btn => {
                        btn.onclick = () => {
                            const lvl = btn.dataset.lvl;
                            levelFilter[lvl] = !levelFilter[lvl];
                            btn.classList.toggle('on', levelFilter[lvl]);
                            refreshLevelFilter();
                        };
                    });

                    getId('rc').onscroll = (e) => {
                        last_known_scroll_position = e.target.scrollTop;
                        var near_end = newestFirst
                            ? last_known_scroll_position === 0
                            : (e.target.scrollHeight - e.target.scrollTop - e.target.clientHeight) < 40;
                        if (near_end) {
                            autoScroll = true;
                            getId('scrollbtn').classList.add('on');
                            var hidden = document.getElementsByClassName('hide');
                            for (var i=hidden.length-1; i>=0; i--)
                                hidden[i].className = hidden[i].className.replace(/\bhide\b/g,'').trim();
                        } else {
                            autoScroll = false;
                            getId('scrollbtn').classList.remove('on');
                        }
                    };

                    updateLogCountDisplay = () => {
                        getId('lcount').textContent = '!{lShown}'.replace('{0}', visibleCount).replace('{1}', logcount);
                    };

                    showFilterErr = (msg) => {
                        filter.style['border-color'] = 'red';
                    };

                    updateFilter = (new_filter_source) => {
                        if (currfilter && currfilter.source === new_filter_source) return;
                        var newfilter = null;
                        if (new_filter_source) {
                            try {
                                newfilter = new RegExp(new_filter_source, 'i');
                                newfilter.matchCounts = {true:0,false:0};
                            } catch(err) { return showFilterErr('!{lInvalidRegex}'); }
                        }
                        const logs = rows.getElementsByClassName('log');
                        visibleCount = 0;
                        for (let i = 0; i < logs.length; i++) {
                            if (applyAllFilters(logs[i])) visibleCount++;
                        }
                        currfilter = newfilter;
                        updateLogCountDisplay();
                    };

                    var filter_pause = 0;
                    filter.oninput = (e) => {
                        if (filter_pause++) return;
                        filter.style['border-color'] = '';
                        ({
                            wait() {
                                setTimeout(() => {
                                    if (filter_pause === 1)
                                        return filter_pause=0, updateFilter(filter.value);
                                    filter_pause = 1;
                                    this.wait();
                                }, 250);
                            }
                        }).wait();
                    };
                    filter.onkeyup = (e) => {
                        /^(escape|enter)$/i.test(e.key) && filter.blur();
                    };

                    window.addEventListener('keypress', function(e) {
                        if (e.ctrlKey && /[aA]/.test(e.key) && !selectall) {
                            selectall = 1;
                            selecttext(rows);
                        }
                    });
                    window.addEventListener('keyup', function(e) {
                        selectall = 0;
                        /^escape$/i.test(e.key) && selecttext(null);
                    });

                    var connect = () => {
                        try {
                            setStatus('!{lConnecting}');
                            var x = new WebSocket('ws://127.0.0.1:!{wssport}/!{logcatid}');
                            x.onopen = e => {
                                setStatus('');
                                getId('clearlcbtn').disabled = false;
                                getId('exportbtn').disabled = false;
                                ws = x;
                                x.send('cmd:list_processes');
                            };
                            x.onclose = e => {
                                ws = null;
                                getId('clearlcbtn').disabled = true;
                                getId('exportbtn').disabled = true;
                            };
                            x.onerror = e => { setStatus('!{lConnectionError}'); };
                            x.onmessage = e => {
                                if (!rows) return;
                                var rawlogs = e.data.trim();
                                if (/^:disconnect$/.test(rawlogs)) {
                                    x.close(); setStatus('Device disconnected');
                                    return;
                                }
                                if (/^:logcat_cleared$/.test(rawlogs)) {
                                    rows.innerHTML = '';
                                    logcount = prevlc = 0;
                                    visibleCount = 0;
                                    if (currfilter) currfilter.matchCounts = {true:0,false:0};
                                    updateLogCountDisplay();
                                    return;
                                }
                                if (/^:filter_updated$/.test(rawlogs)) {
                                    // the backend restarted the logcat with a new filter mode
                                    return;
                                }
                                if (rawlogs.indexOf('!processes:') === 0) {
                                    // populate the process dropdown with debuggable processes
                                    try {
                                        const list = JSON.parse(rawlogs.slice('!processes:'.length));
                                        const sel = getId('procselect');
                                        const cur = sel.value;
                                        while (sel.options.length > 2) sel.remove(sel.options.length - 1);
                                        list.forEach(p => {
                                            const opt = document.createElement('option');
                                            opt.value = 'proc:' + p.pid;
                                            opt.textContent = (p.name || ('pid ' + p.pid)) + ' (' + p.pid + ')';
                                            sel.appendChild(opt);
                                        });
                                        sel.value = cur;
                                    } catch (e) {}
                                    return;
                                }
                                // rawlogs is a <div class="logblock">...</div> of <div class="log X">...</div>
                                // (newest-first, as buffered by the backend)
                                var block = document.createElement('div');
                                block.innerHTML = rawlogs;
                                var logEls = block.getElementsByClassName('log');
                                var lines = [];
                                for (var i = logEls.length - 1; i >= 0; i--) {
                                    lines.push(logEls[i].textContent);
                                }
                                // pendingLines stays chronological (oldest first);
                                // flushPending renders it according to the direction
                                pendingLines = lines.concat(pendingLines);
                                scheduleFlush();
                            };
                        } catch(e) { setStatus('Connection exception'); }
                    };
                    !{connected} && connect();
                };

                window.addEventListener("load", function(event) {
                    try { start(); } catch(e) { setStatus('start exception: '+e.message); }
                });
            })();
    </script>
</body>
</html>
